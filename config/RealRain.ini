# RealRain XP12 configuration
# Lives at <X-Plane 12>/Resources/plugins/RealRain/RealRain.ini
# Reload in the sim with: Plugins > RealRain > Reload RealRain.ini
# Lines starting with # are comments.

# ---------------------------------------------------------------------------
# Prototype / diagnostics
# ---------------------------------------------------------------------------
show_debug_window = 1

# Draws a translucent blue rectangle in front of the pilot's eyes, fixed to the
# airframe. If it stays put while you pan the view and fly, airframe-locked
# drawing works and the windshield droplets can be built on it.
test_quad = 0
test_quad_depth_test = 0        # 0 = drawn on top of everything
# Meters from the pilot eye point (x right, y up, z aft -> forward is negative)
test_quad_offset_x = 0.0
test_quad_offset_y = 0.0
test_quad_offset_z = -0.9
test_quad_width    = 0.8
test_quad_height   = 0.4

# "Scan rain datarefs" logs every dataref whose name contains one of these.
scan_terms = rain, precip, streak, drop, wet, wiper

# ---------------------------------------------------------------------------
# Probes: datarefs to show live in the debug window (checks they exist).
# ---------------------------------------------------------------------------
probe = sim/weather/aircraft/precipitation_on_aircraft_ratio
probe = sim/weather/rain_percent

# ---------------------------------------------------------------------------
# Streak overrides: datarefs forced to a value while
# "Apply streak overrides" is on, and restored afterwards.
# Format:   override <dataref name> = <value>
# The names X-Plane 12 uses for its rain-streak art controls are not known yet.
# Find candidates with "Scan rain datarefs", add them as probes, then try them here.
# ---------------------------------------------------------------------------
streak_overrides = 0
# override sim/private/controls/EXAMPLE/NAME = 0.0
